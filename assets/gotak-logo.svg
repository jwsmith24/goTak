  <!-- Wide banner and slab lettering echo the visual weight of classic TAK badges. -->
  <path d="M58 280h604l-34 190H92z" fill="#050D16" stroke="#071725" stroke-linejoin="round" stroke-width="15"/>
  <path d="M76 298h568l-3 14H79z" fill="#29C4B2"/>
  <text x="360" y="424" fill="#F7FAFC" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="139" font-weight="900" letter-spacing="-10" text-anchor="middle">goTAK</text>
</svg>
