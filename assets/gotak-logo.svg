<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
  <title id="title">goTAK shield logo</title>
  <desc id="desc">A friendly blue gopher above a bold goTAK wordmark on a clean dark shield with teal accents.</desc>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263D55"/>
      <stop offset="1" stop-color="#0B1F35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#081828" flood-opacity=".24"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <path d="M360 34 611 133v174c0 145-91 238-251 301C200 545 109 452 109 307V133z" fill="#071725" stroke="#071725" stroke-linejoin="round" stroke-width="28"/>
    <path d="M360 34 611 133v174c0 145-91 238-251 301C200 545 109 452 109 307V133z" fill="url(#shield)" stroke="#29C4B2" stroke-linejoin="round" stroke-width="8"/>
    <path d="M360 59 588 149v158c0 130-80 214-228 273-148-59-228-143-228-273V149z" fill="none" stroke="#F7FAFC" stroke-opacity=".32" stroke-linejoin="round" stroke-width="3"/>
  </g>

  <!-- Adapted from Takuya Ueda's CC BY 3.0 front-facing Go gopher vector. -->
  <g transform="translate(281 111) scale(.73)">
    <path d="M207.3 44.6c-6.7-13.7-22.9-1.6-27-5.9-21-21.6-46.4-27-66.3-28h-11c-20 .5-45.4 6.3-66.3 28-4.1 4.3-20.4-7.8-27 5.9-7.7 16 15.7 17.6 14.5 24.7-2.3 12.8-.8 31.8 1 50.5 2.8 31.7-20.9 107.6 28.4 138.1 9.3 5.8 34.4 9 56.2 9.5h.2c21.8-.5 43.9-3.7 53.2-9.5 49.4-30.5 25.7-106.4 28.6-138.1 1.7-18.7 3.2-37.7 1-50.5-1.2-7.1 22.2-8.8 14.5-24.7z" fill="#69D2E7" stroke="#050D16" stroke-width="5"/>
    <path d="M143.2 54.3c-33.4 3.9-28.9 38.7-16 50 24 21 49 0 46.2-21.2-2.5-20.4-19.8-30-30.2-28.8z" fill="#F7FAFC" stroke="#050D16" stroke-width="3"/>
    <circle cx="145.5" cy="84.3" r="11.4" fill="#050D16"/>
    <circle cx="142.5" cy="79.4" r="3.6" fill="#F7FAFC"/>
    <path d="M73.6 54.3c33.4 3.9 28.9 38.7 16 50-24 21-49 0-46.2-21.2 2.6-20.4 19.9-30 30.2-28.8z" fill="#F7FAFC" stroke="#050D16" stroke-width="3"/>
    <circle cx="71.4" cy="84.3" r="11.4" fill="#050D16"/>
    <circle cx="74.4" cy="79.4" r="3.6" fill="#F7FAFC"/>
    <path d="M108.5 107c-16 2.4-21.7 7-20.5 14.2 2 11.8 39.7 10.5 40.9.6 1-8.5-14.1-15.7-20.4-14.8z" fill="#C8A58C"/>
    <path d="M98.2 111.8c-2.7 9.8 21.7 8.3 21.1 2-.3-3.7-3.6-8.4-12.3-8.2-3.4.1-7.6 1.6-8.8 6.2z" fill="#050D16"/>
    <path d="M99 127.7c-.9.4-2.4 10.2 2.2 10.7 3.1.3 11.6 1.3 13.6 0 3.9-2.5 3.5-8.5 1.3-10-3.7-2.4-16.1-1.2-17.1-.7z" fill="#F7FAFC" stroke="#050D16" stroke-width="2"/>
